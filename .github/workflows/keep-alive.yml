name: Supabase Keep-Alive

on:
  schedule:
    # Berjalan otomatis setiap 3 hari sekali pukul 00:00 UTC
    - cron: '0 0 */3 * *'
  workflow_dispatch:
    # Memungkinkan pemicuan manual dari tab Actions di GitHub

jobs:
  ping:
    name: Ping Supabase Database
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Jalankan Skrip Keep-Alive
        run: node scripts/ping-supabase.mjs
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL || secrets.SUPABASE_URL || 'https://wcbpbajlwbotscohhsyt.supabase.co' }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY || secrets.SUPABASE_ANON_KEY || 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6IndjYnBiYWpsd2JvdHNjb2hoc3l0Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODk3NDcxNTcsImV4cCI6MjEwNTMyMzE1N30.6bRDsKGMOtyoY6pkOvgHsqsFasRRpf5tkimbtaIRTks' }}
